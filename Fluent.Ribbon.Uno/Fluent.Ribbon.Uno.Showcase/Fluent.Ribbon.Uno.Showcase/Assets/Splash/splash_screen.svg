<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Fluent.Ribbon.Uno.Showcase - splash screen artwork.
  The complete app logo (tile + mark) on a rounded Fluent surface.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
  <defs>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="456" y2="456">
      <stop offset="0" stop-color="#A96CF2" />
      <stop offset="0.52" stop-color="#7B3FD4" />
      <stop offset="1" stop-color="#4A2790" />
    </linearGradient>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="92" cy="64" r="410">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="surface" gradientUnits="userSpaceOnUse" x1="58" y1="260" x2="398" y2="400">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.46" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.28" />
    </linearGradient>
    <linearGradient id="letter" gradientUnits="userSpaceOnUse" x1="72" y1="56" x2="292" y2="362">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#ECE1FF" />
    </linearGradient>
  </defs>

  <rect width="456" height="456" rx="100" ry="100" fill="url(#tile)" />
  <rect width="456" height="456" rx="100" ry="100" fill="url(#light)" />

  <rect x="58" y="260" width="340" height="140" rx="32" fill="url(#surface)" />

  <g fill="#FFFFFF" opacity="0.55">
    <rect x="192" y="290" width="44" height="44" rx="14" />
    <rect x="250" y="290" width="44" height="44" rx="14" />
    <rect x="308" y="290" width="44" height="44" rx="14" />
    <rect x="192" y="348" width="160" height="28" rx="11" />
  </g>

  <g fill="url(#letter)">
    <rect x="72" y="56" width="72" height="306" rx="22" />
    <rect x="72" y="56" width="220" height="72" rx="22" />
    <rect x="72" y="158" width="180" height="72" rx="22" />
  </g>
</svg>
