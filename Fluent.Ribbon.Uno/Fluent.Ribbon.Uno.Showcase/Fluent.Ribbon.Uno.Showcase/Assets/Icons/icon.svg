<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Fluent.Ribbon.Uno.Showcase - app icon background layer.
  Modern Fluent reinterpretation of the original WPF sample logo:
  the Office-era violet tile, rebuilt as a clean gradient with a soft light source.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
  <defs>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="456" y2="456">
      <stop offset="0" stop-color="#A96CF2" />
      <stop offset="0.52" stop-color="#7B3FD4" />
      <stop offset="1" stop-color="#4A2790" />
    </linearGradient>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="92" cy="64" r="410">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="456" height="456" fill="url(#tile)" />
  <rect width="456" height="456" fill="url(#light)" />
</svg>
