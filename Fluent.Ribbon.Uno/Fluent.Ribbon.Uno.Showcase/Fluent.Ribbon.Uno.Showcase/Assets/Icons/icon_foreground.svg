<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Fluent.Ribbon.Uno.Showcase - app icon foreground layer.
  A bold "F" overlapping a translucent ribbon surface, echoing the way the original
  WPF sample logo layered its ribbon strip behind the letter.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
  <defs>
    <linearGradient id="surface" gradientUnits="userSpaceOnUse" x1="58" y1="260" x2="398" y2="400">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.46" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.28" />
    </linearGradient>
    <linearGradient id="letter" gradientUnits="userSpaceOnUse" x1="72" y1="56" x2="292" y2="362">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#ECE1FF" />
    </linearGradient>
  </defs>

  <!-- Ribbon surface -->
  <rect x="58" y="260" width="340" height="140" rx="32" fill="url(#surface)" />

  <!-- Ribbon commands -->
  <g fill="#FFFFFF" opacity="0.55">
    <rect x="192" y="290" width="44" height="44" rx="14" />
    <rect x="250" y="290" width="44" height="44" rx="14" />
    <rect x="308" y="290" width="44" height="44" rx="14" />
    <rect x="192" y="348" width="160" height="28" rx="11" />
  </g>

  <!-- Letter mark -->
  <g fill="url(#letter)">
    <rect x="72" y="56" width="72" height="306" rx="22" />
    <rect x="72" y="56" width="220" height="72" rx="22" />
    <rect x="72" y="158" width="180" height="72" rx="22" />
  </g>
</svg>
